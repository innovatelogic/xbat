<!DOCTYPE html>
<html>
  <head>

    <script>
      window.SPA_MODE = true;
    </script>

    <?!= include('styles_topnav'); ?>

    <?!= include('user_topnav_js'); ?>
  </head>
<body>

<?!= include('user_topnav', { sku_name: sku_name }); ?>

<div class="topnav">
  <a class="#" href="#" onclick="loadPage('order_processor'); return false;">Home</a>
  <a class="#" href="#" onclick="loadPage('sales_terminal'); return false;">Sales Terminal</a>
</div>

<main id="content">
  Loading...
</main>


<script>

const initialPage = "<?= page ?>";

function loadPage(page) {

  google.script.run
    .withSuccessHandler(function(result) {

      // result:
      // {
      //   html: "...",
      //   js: "..."
      // }

      document.getElementById("content").innerHTML = result.html;

      // Dynamically execute page-specific JS.
      if (result.js) {
        const doc = new DOMParser().parseFromString(result.js, "text/html");
        const scripts = doc.querySelectorAll("script");
        if (scripts.length === 0) {
          console.error("No <script> found in result.js:", result.js);
          return;
        }

        scripts.forEach(source => {
          const script = document.createElement("script");
          script.dataset.page = page;
          script.textContent = source.textContent;
          document.head.appendChild(script);
        });
      }

      // Call page initializer.
      const init = window[page + "_init"];
      if (typeof init === "function") {
        init();
      }
      else { 
        console.warn( "[SPA] Initializer not found:", page + "_init" ); 
      }

    })
    .withFailureHandler(function(error) {
      console.error("Failed to load page:", page, error);
      document.getElementById("content").innerHTML =
        "<div class='error'>Failed to load page: " +
        String(error.message || error) +
        "</div>";
    })
    .get_page(page);
}

loadPage(initialPage);

</script>

</body>
</html>
