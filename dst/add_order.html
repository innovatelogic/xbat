
<div id="add-order-page">
  
  <h2>Нове замовлення</h2>

  <label>Дані покупця</label><br>
  <textarea id="client-info" style="width:100%; height:90px; resize:vertical;"></textarea><br><br>
  
  <label>Примітка</label><br>
  <input id="notes" type="text" style="width:100%"><br><br>

  <label>Оплата</label><br>
  <div id="accounts"></div>
  <h5>Tax:<br><span id="tax-formula"></span></h5>

  <h3>Позиції:</h3>
  <div id="positions"></div>

  <button id="addItemBtn" onclick="add_position()" disabled>+ Add Item</button>

  <h3>Загальна ціна замовлення: <br><span id="order_total">0 грн</span></h3>

  <br>
  <button id="submitOrderBtn" onclick="submitOrderConfirm()">Submit Order</button>

  <!-- ===================== CONFIRMATION MODAL ===================== -->
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <h2>Підтвердіть замовлення</h2>
      <div id="confirm-container"></div>
     
      <div class="modal-buttons">
        <hr>
        <label id="confirm-container-bottom" style="font-size: 1.2rem; font-weight: bold;"></label><br>

        <button class="cancel-btn" onclick="close_modal()">Скасувати</button>
        <button class="confirm-btn" onclick="confirm_submit()">Підтвердити</button>
      </div>
    </div>
  </div>

</div>
